name: Release

on:
  push:
    tags: ['v*']

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test -c Release

  binaries:
    name: GitHub Release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload assets
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained binaries
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p artifacts
          for rid in win-x64 win-arm64 linux-x64 linux-arm64 osx-arm64; do
            dotnet publish src/Heic2Jpeg -c Release -r "$rid" -p:Version="$VERSION" -o "publish/$rid"
            name="heic2jpeg-$VERSION-$rid"
            if [[ "$rid" == win-* ]]; then
              (cd "publish/$rid" && zip -q "../../artifacts/$name.zip" heic2jpeg.exe)
            else
              tar -C "publish/$rid" -czf "artifacts/$name.tar.gz" heic2jpeg
            fi
          done
          (cd artifacts && sha256sum * > SHA256SUMS.txt)
          ls -la artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "${prerelease[@]}"

  manifests:
    name: Scoop and Homebrew
    needs: binaries
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the updated manifests to master
      actions: write # start the packaging workflow on the new commit
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master

      - name: Update manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          gh release download "$GITHUB_REF_NAME" -p SHA256SUMS.txt -D "$RUNNER_TEMP"
          .github/scripts/update-manifests.sh "$VERSION" "$RUNNER_TEMP/SHA256SUMS.txt"
          git add bucket Formula
          if git diff --cached --quiet; then
            echo "Manifests already point at $VERSION"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Update Scoop and Homebrew manifests to $VERSION"
          git push
          # Pushes made with GITHUB_TOKEN don't trigger workflows, so start the install check explicitly.
          gh workflow run packaging.yml --ref master

  winget:
    name: WinGet
    needs: binaries
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      # Opens a PR against microsoft/winget-pkgs from a fork under the repo owner's account.
      # WINGET_TOKEN is a classic PAT with public_repo scope. The first version must already be
      # in winget-pkgs (submitted by hand), so this step is skipped until the secret exists.
      - name: Submit to winget-pkgs
        if: env.WINGET_TOKEN != ''
        uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: pzarek.heic2jpeg
          installers-regex: '-win-(x64|arm64)\.zip$'
          token: ${{ env.WINGET_TOKEN }}

  nuget:
    name: NuGet
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for NuGet Trusted Publishing
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Pack
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          dotnet pack src/Heic2Jpeg -c Release -p:Version="$VERSION" -o nupkg
          ls -la nupkg

      # Trusted Publishing: exchange the job's OIDC token for a NuGet API key that lives one hour.
      # Requires a policy on nuget.org (Trusted Publishing page) for pzarek/heic2jpeg + release.yml,
      # and a NUGET_USER repository secret holding the nuget.org profile name (not the email).
      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          dotnet nuget push nupkg/*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
