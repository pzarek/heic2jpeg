name: Release

on:
  push:
    tags: ['v*']

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test -c Release

  binaries:
    name: GitHub Release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload assets
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained binaries
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p artifacts
          for rid in win-x64 win-arm64 linux-x64 linux-arm64 osx-arm64; do
            dotnet publish src/Heic2Jpeg -c Release -r "$rid" -p:Version="$VERSION" -o "publish/$rid"
            name="heic2jpeg-$VERSION-$rid"
            if [[ "$rid" == win-* ]]; then
              (cd "publish/$rid" && zip -q "../../artifacts/$name.zip" heic2jpeg.exe)
            else
              tar -C "publish/$rid" -czf "artifacts/$name.tar.gz" heic2jpeg
            fi
          done
          (cd artifacts && sha256sum * > SHA256SUMS.txt)
          ls -la artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "${prerelease[@]}"

  manifests:
    name: Scoop and Homebrew
    needs: binaries
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    # master only accepts changes through pull requests that pass CI, so the updated
    # manifests go through a pull request that merges itself once the checks pass.
    # Needs "Allow GitHub Actions to create and approve pull requests" in the repository's
    # Actions settings.
    permissions:
      contents: write # push the manifests branch
      pull-requests: write # open the pull request and turn on auto-merge
      actions: write # start CI and the packaging check on the branch
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master

      - name: Open a pull request with the updated manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          BRANCH="manifests/v$VERSION"
          gh release download "$GITHUB_REF_NAME" -p SHA256SUMS.txt -D "$RUNNER_TEMP"
          .github/scripts/update-manifests.sh "$VERSION" "$RUNNER_TEMP/SHA256SUMS.txt"
          git add bucket Formula
          if git diff --cached --quiet; then
            echo "Manifests already point at $VERSION"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git commit -m "Update Scoop and Homebrew manifests to $VERSION"
          # --force so a re-run of this job replaces the branch from the earlier attempt.
          git push --force origin "$BRANCH"
          if [[ "$(gh pr list --head "$BRANCH" --state open --json number --jq length)" == 0 ]]; then
            gh pr create --base master --head "$BRANCH" \
              --title "Update Scoop and Homebrew manifests to $VERSION" \
              --body "Points \`bucket/\` and \`Formula/\` at the $GITHUB_REF_NAME release. Opened by the [release workflow]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID); it merges itself once CI passes."
          fi
          # Turn on auto-merge before any check has run, while the pull request is still blocked.
          gh pr merge "$BRANCH" --auto --squash
          # Pull requests and pushes made with GITHUB_TOKEN don't trigger workflows, so start
          # the required CI checks and the install check on the branch explicitly.
          gh workflow run ci.yml --ref "$BRANCH"
          gh workflow run packaging.yml --ref "$BRANCH"

  winget:
    name: WinGet
    needs: binaries
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      # Opens a PR against microsoft/winget-pkgs from a fork under the repo owner's account.
      # WINGET_TOKEN is a classic PAT with public_repo scope. The first version must already be
      # in winget-pkgs (submitted by hand), so this step is skipped until the secret exists.
      - name: Submit to winget-pkgs
        if: env.WINGET_TOKEN != ''
        uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: pzarek.heic2jpeg
          installers-regex: '-win-(x64|arm64)\.zip$'
          token: ${{ env.WINGET_TOKEN }}

  nuget:
    name: NuGet
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for NuGet Trusted Publishing
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Pack
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          dotnet pack src/Heic2Jpeg -c Release -p:Version="$VERSION" -o nupkg
          ls -la nupkg

      # Trusted Publishing: exchange the job's OIDC token for a NuGet API key that lives one hour.
      # Requires a policy on nuget.org (Trusted Publishing page) for pzarek/heic2jpeg + release.yml,
      # and a NUGET_USER repository secret holding the nuget.org profile name (not the email).
      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          dotnet nuget push nupkg/*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
